# runs the go test suite on every push. no separate service to boot first,
# the fake receiver lives entirely inside the test process itself

name: go tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: vet
        run: go vet ./...

      - name: run tests
        run: go test ./... -v
